name: ci-safe-mamba2-pilot

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HF_HOME: .cache/hf
      TRANSFORMERS_CACHE: .cache/hf
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore model/artifact cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/hf
            artifacts/checkpoints
            artifacts/metrics/runtime_state.json
          key: ${{ runner.os }}-mamba2-pilot-${{ hashFiles('requirements.txt', 'config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-mamba2-pilot-

      - name: Install dependencies
        run: make setup

      - name: Run full pilot pipeline
        run: make ci

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: mamba2-pilot-artifacts
          if-no-files-found: error
          path: |
            artifacts/metrics/*.json
            artifacts/report/*
